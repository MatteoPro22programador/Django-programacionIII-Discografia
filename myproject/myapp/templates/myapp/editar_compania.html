{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Compañía | Discografía</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="{% static 'myapp/style.css' %}">
</head>

<body>

    <header>
        <div class="logo">
            <img src="{% static 'myapp/img/Logo.png' %}" class="img">
            <p>Discografía</p>
        </div>
        <nav>
            <a href="index_1">Inicio</a>
            <a href="grabaciones">Grabaciones</a>
            <a href="interpretes">Intérpretes</a>
            <a href="companias" class="activo">Companías</a>
            <a href="formatos">Formatos</a>
            {% if request.session.nivel == 'ADMIN' %}
            <a href="usuarios">Usuarios</a>
            {% endif %}
            <a href="{% url 'logout' %}" style="margin-left:auto; color:#d9384a;">Cerrar sesión</a>
        </nav>
        
    </header>

    <section class="listado">
        <h1>Editar Compañía</h1>

        <form method="POST" class="form-tarea">
            {% csrf_token %}

            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required value="{{ compania.nombre }}">

            <label for="direccion">Dirección</label>
            <input type="text" id="direccion" name="direccion" value="{{ compania.direccion|default:'' }}">

            <button type="submit" class="btn-principal">Guardar cambios</button>
            <a href="{% url 'companias' %}" class="btn-secundario">Cancelar</a>
        </form>
    </section>

    <footer>
        <p>Discografía - Don Pepe Muelas</p>
    </footer>

</body>
</html>

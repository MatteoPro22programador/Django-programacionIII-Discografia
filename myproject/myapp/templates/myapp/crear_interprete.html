{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Intérprete | Discografía</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="{% static 'myapp/style.css' %}">
</head>

<body>

    <header>
        <div class="logo">
            <img src="{% static 'myapp/img/Logo.png' %}" class="img">
            <p>Discografía</p>
        </div>
        <nav>
            <a href="index_1">Inicio</a>
            <a href="grabaciones">Grabaciones</a>
            <a href="interpretes" class="activo">Intérpretes</a>
            <a href="companias">Companías</a>
            <a href="formatos">Formatos</a>
            {% if request.session.nivel == 'ADMIN' %}
            <a href="usuarios">Usuarios</a>
            {% endif %}
            <a href="{% url 'logout' %}" style="margin-left:auto; color:#d9384a;">Cerrar sesión</a>
        </nav>

    </header>

    <section class="listado">
        <h1>Nuevo Intérprete</h1>

        <form method="POST" class="form-tarea">
            {% csrf_token %}

            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" name="descripcion" rows="3"></textarea>

            <button type="submit" class="btn-principal">Guardar intérprete</button>
        </form>
    </section>

    <footer>
        <p>Discografía - Don Pepe Muelas</p>
    </footer>

</body>
</html>

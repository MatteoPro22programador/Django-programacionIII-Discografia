{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuario | Discografía</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="{% static 'myapp/style.css' %}">
</head>

<body>

    <header>
        <div class="logo">
            <img src="{% static 'myapp/img/Logo.png' %}" class="img">
            <p>Discografía</p>
        </div>
        <nav>
            <a href="index_1">Inicio</a>
            <a href="grabaciones">Grabaciones</a>
            <a href="interpretes">Intérpretes</a>
            <a href="companias">Companías</a>
            <a href="formatos">Formatos</a>
            <a href="usuarios" class="activo">Usuarios</a>
            <a href="{% url 'logout' %}" style="margin-left:auto; color:#d9384a;">Cerrar sesión</a>
        </nav>
        
    </header>

    <section class="listado">
        <h1>Editar Usuario: {{ usuario.username }}</h1>

        {% if error %}
        <p class="mensaje-error">{{ error }}</p>
        {% endif %}

        <form method="POST" class="form-tarea">
            {% csrf_token %}

            <label for="username">Username</label>
            <input type="text" id="username" value="{{ usuario.username }}" disabled>

            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required maxlength="100" value="{{ usuario.nombre }}">

            <label for="password">Contraseña (dejar vacío para no cambiar)</label>
            <input type="password" id="password" name="password" placeholder="••••••••">

            <label for="nivel">Nivel</label>
            <select id="nivel" name="nivel" required>
                <option value="VISOR" {% if usuario.nivel == 'VISOR' %}selected{% endif %}>VISOR (solo lectura)</option>
                <option value="ADMIN" {% if usuario.nivel == 'ADMIN' %}selected{% endif %}>ADMIN (acceso total)</option>
            </select>

            <button type="submit" class="btn-principal">Guardar cambios</button>
            <a href="{% url 'usuarios' %}" class="btn-secundario">Cancelar</a>
        </form>
    </section>

    <footer>
        <p>Discografía - Don Pepe Muelas</p>
    </footer>

</body>
</html>

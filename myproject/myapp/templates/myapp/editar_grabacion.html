{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Grabación | Discografía</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="{% static 'myapp/style.css' %}">
</head>

<body>

    <header>
        <div class="logo">
            <img src="{% static 'myapp/img/Logo.png' %}" class="img">
            <p>Discografía</p>
        </div>
        <nav>
            <a href="index_1">Inicio</a>
            <a href="grabaciones" class="activo">Grabaciones</a>
            <a href="interpretes">Intérpretes</a>
            <a href="companias">Companías</a>
            <a href="formatos">Formatos</a>
            {% if request.session.nivel == 'ADMIN' %}
            <a href="usuarios">Usuarios</a>
            {% endif %}
            <a href="{% url 'logout' %}" style="margin-left:auto; color:#d9384a;">Cerrar sesión</a>
        </nav>
        
    </header>

    <section class="listado">
        <h1>Editar Grabación</h1>

        <form method="POST" class="form-tarea">
            {% csrf_token %}

            <label for="titulo">Título</label>
            <input type="text" id="titulo" name="titulo" required value="{{ grabacion.titulo }}">

            <label for="categoria">Categoría</label>
            <input type="text" id="categoria" name="categoria" value="{{ grabacion.categoria|default:'' }}">

            <label for="num_temas">Número de temas</label>
            <input type="number" id="num_temas" name="num_temas" value="{{ grabacion.num_temas|default:'' }}">

            <label for="anio">Año</label>
            <input type="number" id="anio" name="anio" value="{{ grabacion.anio|default:'' }}">

            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" name="descripcion" rows="3">{{ grabacion.descripcion|default:'' }}</textarea>

            <label for="id_compania">Compañía</label>
            <select id="id_compania" name="id_compania">
                <option value="">-- Seleccionar --</option>
                {% for compania in companias %}
                    <option value="{{ compania.id_compania }}"
                        {% if compania.id_compania|stringformat:"s" == grabacion.id_compania|stringformat:"s" %}selected{% endif %}>
                        {{ compania.nombre }}
                    </option>
                {% endfor %}
            </select>

            <label for="id_interprete">Intérprete</label>
            <select id="id_interprete" name="id_interprete">
                <option value="">-- Seleccionar --</option>
                {% for interprete in interpretes %}
                    <option value="{{ interprete.id_interprete }}"
                        {% if interprete.id_interprete|stringformat:"s" == grabacion.id_interprete|stringformat:"s" %}selected{% endif %}>
                        {{ interprete.nombre }}
                    </option>
                {% endfor %}
            </select>

            <button type="submit" class="btn-principal">Guardar cambios</button>
            <a href="{% url 'grabaciones' %}" class="btn-secundario">Cancelar</a>
        </form>
    </section>

    <footer>
        <p>Discografía - Don Pepe Muelas</p>
    </footer>

</body>
</html>

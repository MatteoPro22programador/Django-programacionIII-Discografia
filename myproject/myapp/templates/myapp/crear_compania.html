{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Compañía | Discografía</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="{% static 'myapp/style.css' %}">
</head>

<body>

    <header>
        <div class="logo">
            <img src="{% static 'myapp/img/Logo.png' %}" class="img">
            <p>Discografía</p>
        </div>
        <nav>
            <a href="index_1">Inicio</a>
            <a href="grabaciones">Grabaciones</a>
            <a href="interpretes">Intérpretes</a>
            <a href="companias" class="activo">Companías</a>
            <a href="formatos">Formatos</a>
        </nav>
    </header>

    <section class="listado">
        <h1>Nueva Compañía</h1>

        <form method="POST" class="form-tarea">
            {% csrf_token %}

            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" required>

            <label for="direccion">Dirección</label>
            <input type="text" id="direccion" name="direccion">

            <button type="submit" class="btn-principal">Guardar compañía</button>
        </form>
    </section>

    <footer>
        <p>Discografía - Don Pepe Muelas</p>
    </footer>

</body>
</html>
